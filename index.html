<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relógio Vertical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff; /* Fundo branco conforme imagem */
            color: #000000;            /* Letras e números pretos */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 5vh 0;
        }
        .bloco-hora {
            font-size: 38vh; /* Tamanho massivo baseado na altura vertical */
            font-weight: 900; /* Fonte bem grossa (bold) */
            line-height: 0.85; /* Aproxima os números verticalmente */
            letter-spacing: -2px;
        }
        .data {
            font-size: 5vh; /* Tamanho proporcional para a data */
            font-weight: bold;
            margin-top: auto; /* Empurra a data para a parte inferior */
            text-transform: uppercase;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Horas em cima -->
        <div id="horas" class="bloco-hora">00</div>
        <!-- Minutos embaixo -->
        <div id="minutos" class="bloco-hora">00</div>
        <!-- Data no rodapé -->
        <div id="data" class="data">DIA/MÊS/ANO</div>
    </div>

    <script>
        function atualizarRelogio() {
            const agora = new Date();
            
            // Pega horas e minutos formatados com 2 dígitos
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            
            // Pega a data local formatada (ex: 16/06/2026)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();

            // Atualiza os elementos na tela
            document.getElementById('horas').textContent = horas;
            document.getElementById('minutos').textContent = minutos;
            document.getElementById('data').textContent = `${dia}/${mes}/${ano}`;
        }

        // Executa imediatamente e depois a cada segundo
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);

        // Bloqueio para a tela não apagar (se suportado pelo navegador)
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            async function solicitarWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log(`${err.name}, ${err.message}`);
                }
            }
            document.addEventListener('click', solicitarWakeLock);
            window.addEventListener('focus', solicitarWakeLock);
        }
    </script>
</body>
</html>
