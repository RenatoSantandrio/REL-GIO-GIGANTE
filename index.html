<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relógio Gigante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }
        #relogio {
            font-size: 28vw; /* Ajusta o tamanho baseado na largura da tela */
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            line-height: 1;
        }
        /* Ajuste para telas deitadas (landscape) */
        @media (orientation: landscape) {
            #relogio {
                font-size: 28vh; /* Ajusta baseado na altura se o celular estiver deitado */
            }
        }
    </style>
</head>
<body>

    <div id="relogio">00:00</div>

    <script>
        function atualizarRelogio() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            
            document.getElementById('relogio').textContent = `${horas}:${minutos}`;
        }

        // Atualiza a hora imediatamente e depois a cada segundo
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);

        // Solicita que a tela não desligue (se o navegador suportar)
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            async function solicitarWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log(`${err.name}, ${err.message}`);
                }
            }
            document.addEventListener('click', solicitarWakeLock);
            window.addEventListener('focus', solicitarWakeLock);
        }
    </script>
</body>
</html>
